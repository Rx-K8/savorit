name: Latest Changes

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed
  workflow_dispatch:
    inputs:
      number:
        description: PR number
        required: true
      target_ref:
        description: Branch or ref that contains release-notes.md
        required: false
        default: dev

permissions: {}

jobs:
  latest-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Check update token
        env:
          LATEST_CHANGES_TOKEN: ${{ secrets.LATEST_CHANGES }}
        run: |
          if [ -z "$LATEST_CHANGES_TOKEN" ]; then
            echo "::error::Repository secret LATEST_CHANGES is required to push release-note updates."
            exit 1
          fi

      - name: Checkout target ref
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'dev' }}
          token: ${{ secrets.LATEST_CHANGES }}
          persist-credentials: true

      - name: Check release notes file
        id: release_notes
        run: |
          if [ -f release-notes.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-notes.md does not exist on this ref; skipping latest-changes."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release notes
        if: steps.release_notes.outputs.exists == 'true'
        uses: tiangolo/latest-changes@eb3f6e7ff0073896ecb561e774a121de9418fa06 # 0.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          latest_changes_file: ./release-notes.md
          latest_changes_header: "^## 最新の変更$"
          end_regex: "^## "
          label_header_prefix: "### "
          labels: >
            [
              {"label": "breaking", "header": "破壊的変更"},
              {"label": "security", "header": "セキュリティ修正"},
              {"label": "feature", "header": "機能追加"},
              {"label": "bug", "header": "修正"},
              {"label": "refactor", "header": "リファクタリング"},
              {"label": "upgrade", "header": "依存関係・バージョン更新"},
              {"label": "docs", "header": "ドキュメント"},
              {"label": "infra", "header": "CI/CD・開発基盤"},
              {"label": "internal", "header": "内部変更"}
            ]
          skip_labels: '["release"]'
