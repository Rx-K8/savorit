name: Latest Changes

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed
  workflow_dispatch:
    inputs:
      number:
        description: PR number
        required: true
      target_ref:
        description: Branch or ref that contains release-notes.md
        required: false
        default: dev

permissions: {}

jobs:
  latest-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Check update token
        env:
          LATEST_CHANGES_TOKEN: ${{ secrets.LATEST_CHANGES }}
        run: |
          if [ -z "$LATEST_CHANGES_TOKEN" ]; then
            echo "::error::Repository secret LATEST_CHANGES is required to push release-note updates."
            exit 1
          fi

      - name: Resolve inputs
        id: vars
        env:
          INPUT_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.number || github.event.pull_request.number }}
          INPUT_TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'dev' }}
        run: |
          echo "pr_number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target_ref=$INPUT_TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "update_branch=chore/update-release-notes-pr-$INPUT_PR_NUMBER-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout target ref
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ steps.vars.outputs.target_ref }}
          token: ${{ secrets.LATEST_CHANGES }}
          persist-credentials: true

      - name: Check release notes file
        id: release_notes
        run: |
          if [ -f release-notes.md ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-notes.md does not exist on this ref; skipping latest-changes."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare update branch
        if: steps.release_notes.outputs.exists == 'true'
        id: prepare
        env:
          UPDATE_BRANCH: ${{ steps.vars.outputs.update_branch }}
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch -c "$UPDATE_BRANCH"
          git push -u origin "$UPDATE_BRANCH"

      - name: Update release notes
        if: steps.release_notes.outputs.exists == 'true'
        uses: tiangolo/latest-changes@eb3f6e7ff0073896ecb561e774a121de9418fa06 # 0.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.vars.outputs.pr_number }}
          latest_changes_file: ./release-notes.md
          latest_changes_header: "^## 最新の変更$"
          end_regex: "^## "
          label_header_prefix: "### "
          labels: >
            [
              {"label": "breaking", "header": "破壊的変更"},
              {"label": "security", "header": "セキュリティ修正"},
              {"label": "feature", "header": "機能追加"},
              {"label": "bug", "header": "修正"},
              {"label": "refactor", "header": "リファクタリング"},
              {"label": "upgrade", "header": "依存関係・バージョン更新"},
              {"label": "docs", "header": "ドキュメント"},
              {"label": "infra", "header": "CI/CD・開発基盤"},
              {"label": "internal", "header": "内部変更"}
            ]
          skip_labels: '["release"]'

      - name: Check generated update
        if: steps.release_notes.outputs.exists == 'true'
        id: generated
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger checks on update branch
        if: steps.generated.outputs.changed == 'true'
        run: |
          sudo chown -R "$USER":"$USER" .git release-notes.md
          git commit --allow-empty -m "CIを再実行"
          git push

      - name: Create release notes pull request
        if: steps.generated.outputs.changed == 'true'
        id: release_notes_pr
        env:
          GH_TOKEN: ${{ secrets.LATEST_CHANGES }}
          PR_NUMBER: ${{ steps.vars.outputs.pr_number }}
          TARGET_REF: ${{ steps.vars.outputs.target_ref }}
          UPDATE_BRANCH: ${{ steps.vars.outputs.update_branch }}
        run: |
          pr_url="$(
            gh pr create \
              --base "$TARGET_REF" \
              --head "$UPDATE_BRANCH" \
              --title "リリースノートを更新 (#$PR_NUMBER)" \
              --body "PR #$PR_NUMBER の内容をリリースノートへ追記します。"
          )"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.release_notes_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.LATEST_CHANGES }}
        run: |
          gh pr merge "${{ steps.release_notes_pr.outputs.number }}" --auto --squash --delete-branch
