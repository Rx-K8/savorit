# See https://pre-commit.com for more information.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.0
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: bash -c 'cd backend && uv run ruff check --force-exclude'
        language: system
        types: [python]
        files: ^backend/

      - id: backend-ruff-format
        name: backend ruff format
        entry: bash -c 'cd backend && uv run ruff format --force-exclude --check'
        language: system
        types: [python]
        files: ^backend/

      - id: backend-mypy
        name: backend mypy
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: backend-ty
        name: backend ty
        entry: bash -c 'cd backend && uv run ty check app tests'
        language: system
        pass_filenames: false
        files: ^backend/
